name: AI Migration Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  review:
    if: >
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run AI Reviewer
        uses: actions/github-script@v7
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_MODEL: ${{ vars.MINIMAX_MODEL || 'MiniMax-M3' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          script: |
            const prNumber = context.issue.number;
            const { data: diff } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              mediaType: { format: 'diff' }
            });

            if (!diff || typeof diff !== 'string' || diff.trim().length === 0) {
              console.log("No diff found or diff is empty.");
              return;
            }

            const systemPrompt = [
              "Sen Lumina projesinde Node.js (/backend) servisinden Go (/backend-go) servisine geçişi denetleyen kıdemli yazılım mimarısı ve AI Reviewer agentsın.",
              "Aşağıda bu Go repository'sine yapılan bir Pull Request'in kod değişiklikleri (diff) verilmiştir.",
              "",
              "Görevin:",
              "1. Kodun Go en iyi pratiklerine, Gin web framework ve GORM veritabanı standartlarına uyup uymadığını kontrol etmek.",
              "2. Tip güvenliği, hata yönetimi (error handling), bellek sızıntıları ve güvenlik açıkları açısından detaylı inceleme (code review) yapmak.",
              "3. Node.js backend geçişinde olası mimari veya veri modeli uyumsuzluklarını fark edersen uyarmak.",
              "4. Geri bildirimini net, yapıcı ve Türkçe olarak GitHub PR yorumu formatında, markdown başlıklar ve maddelemeler kullanarak sunmak."
            ].join("\n");

            let aiComment = "";

            if (process.env.MINIMAX_API_KEY) {
              const modelName = process.env.MINIMAX_MODEL || "MiniMax-M3";
              console.log(`Using MiniMax API (${modelName}) for review...`);
              const res = await fetch("https://api.minimax.io/v1/chat/completions", {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.MINIMAX_API_KEY}`
                },
                body: JSON.stringify({
                  model: modelName,
                  messages: [
                    { role: "system", content: systemPrompt },
                    { role: "user", content: `Pull Request Diff:\n\`\`\`diff\n${diff.slice(0, 30000)}\n\`\`\`` }
                  ],
                  max_tokens: 2000
                })
              });
              const data = await res.json();
              if (data.error || !data.choices) {
                console.error("MiniMax API Error:", data);
                aiComment = `⚠️ **AI Reviewer Hatası (MiniMax):** ${data.error?.message || JSON.stringify(data)}`;
              } else {
                aiComment = data.choices?.[0]?.message?.content || "İnceleme oluşturulamadı.";
              }
            } else if (process.env.GEMINI_API_KEY) {
              console.log("Using Gemini API for review...");
              const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${process.env.GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: `${systemPrompt}\n\nPull Request Diff:\n\`\`\`diff\n${diff.slice(0, 30000)}\n\`\`\`` }] }]
                })
              });
              const data = await res.json();
              if (data.error) {
                console.error("Gemini API Error:", data.error);
                aiComment = `⚠️ **AI Reviewer Hatası (Gemini):** ${data.error.message}`;
              } else {
                aiComment = data.candidates?.[0]?.content?.parts?.[0]?.text || "İnceleme oluşturulamadı.";
              }
            } else if (process.env.OPENAI_API_KEY) {
              console.log("Using OpenAI API for review...");
              const res = await fetch("https://api.openai.com/v1/chat/completions", {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`
                },
                body: JSON.stringify({
                  model: "gpt-4o",
                  messages: [
                    { role: "system", content: systemPrompt },
                    { role: "user", content: `Pull Request Diff:\n\`\`\`diff\n${diff.slice(0, 30000)}\n\`\`\`` }
                  ]
                })
              });
              const data = await res.json();
              if (data.error) {
                console.error("OpenAI API Error:", data.error);
                aiComment = `⚠️ **AI Reviewer Hatası (OpenAI):** ${data.error.message}`;
              } else {
                aiComment = data.choices?.[0]?.message?.content || "İnceleme oluşturulamadı.";
              }
            } else {
              aiComment = "⚠️ **AI Reviewer Yapılandırma Hatası:** GitHub Repository Secrets içerisinde `MINIMAX_API_KEY`, `GEMINI_API_KEY` veya `OPENAI_API_KEY` tanımlanmamış. Lütfen repo ayarlarından (`Settings > Secrets and variables > Actions`) bir API anahtarı ekleyin.";
            }

            const commentBody = `### 🤖 Lumina AI Migration Reviewer\n\n${aiComment}\n\n---\n*Bu inceleme Node.js -> Go geçiş standartlarına göre otomatik oluşturulmuştur.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });
